name: Process Live Leaderboard Update

on:
  issues:
    types: [opened]

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  update-live:
    if: startsWith(github.event.issue.title, '[Live]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: leaderboard

      - name: Update live.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          body   = os.environ["ISSUE_BODY"]
          author = os.environ["ISSUE_AUTHOR"].lower()

          try:
              data = json.loads(body)
          except Exception as e:
              print(f"Invalid JSON body: {e}")
              sys.exit(1)

          if data.get("username", "").lower() != author:
              print(f"Username mismatch: body says '{data.get('username')}', issue author is '{author}'")
              sys.exit(1)

          path = "leaderboard/live.json"
          try:
              with open(path) as f:
                  entries = json.load(f)
              if not isinstance(entries, list):
                  entries = []
          except Exception:
              entries = []

          # Upsert: remove old entry for this (user, petRunId) pair, append fresh one.
          # Using (username, petRunId) as the key so multiple simultaneous pets
          # from the same user (e.g. VS Code + PyCharm) are tracked independently.
          new_run_id = str(data.get("petRunId", ""))
          entries = [
              e for e in entries
              if not (e.get("username", "").lower() == author and
                      str(e.get("petRunId", "")) == new_run_id)
          ]

          # Also remove any legacy entries where petRunId == spawnedAt (old format
          # before stable machineId was adopted). Without this, old entries persist
          # alongside the new machineId-keyed entry and inflate the live count.
          new_spawned_at = data.get("spawnedAt")
          if new_spawned_at is not None:
              entries = [
                  e for e in entries
                  if not (e.get("username", "").lower() == author and
                          e.get("spawnedAt") == new_spawned_at and
                          str(e.get("petRunId", "")) != new_run_id)
              ]

          entries.append(data)

          with open(path, "w") as f:
              json.dump(entries, f, indent=2)

          print(f"live.json updated — {len(entries)} active entries")
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add leaderboard/live.json
          git diff --cached --quiet || git commit -m "live: update ${{ github.event.issue.user.login }}'s run"
          git push

      - name: Close this and any other open live issues for this user
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: author,
            });
            for (const issue of issues) {
              if (issue.title.startsWith('[Live]')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

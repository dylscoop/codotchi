name: Process Live Leaderboard Update

on:
  issues:
    types: [opened]

concurrency:
  group: leaderboard-live
  cancel-in-progress: false

jobs:
  # Always runs so non-matching issues end as a success instead of an all-skipped
  # run, which GitHub reports to the repo owner as "No jobs were run".
  route:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Issue opened; routing by title."

  update-live:
    needs: route
    if: startsWith(github.event.issue.title, '[Live]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: leaderboard

      - name: Checkout validator (default branch)
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github/scripts

      # Signed updates from a Codotchi client pass as verified; unsigned ones from
      # pre-2.27.2 clients pass as legacy. Only whitelisted fields are stored
      # (see .github/scripts/leaderboard-validate.mjs).
      - name: Validate update
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          LEADERBOARD_HMAC_KEY: ${{ secrets.LEADERBOARD_HMAC_KEY }}
        run: node tools/.github/scripts/leaderboard-validate.mjs live

      - name: Update live.json
        if: steps.validate.outputs.valid == 'true'
        run: |
          node - <<'JSEOF'
          const fs = require("fs");
          const entry = JSON.parse(fs.readFileSync("/tmp/leaderboard-result.json", "utf8")).entry;
          const path = "leaderboard/live.json";
          let entries = [];
          try { entries = JSON.parse(fs.readFileSync(path, "utf8")); } catch { entries = []; }
          if (!Array.isArray(entries)) { entries = []; }
          const author = entry.username.toLowerCase();
          // Drop pre-integrity entries (neither verified nor legacy), then upsert on (username, petRunId)
          // so one user's pets in different IDEs are tracked independently. Also drop any
          // other entry for this same run (same user + spawnedAt).
          entries = entries.filter(e => e && (e.verified === true || e.legacy === true) &&
            !(String(e.username).toLowerCase() === author &&
              (String(e.petRunId) === entry.petRunId || e.spawnedAt === entry.spawnedAt)));
          entries.push(entry);
          fs.writeFileSync(path, JSON.stringify(entries, null, 2) + "\n");
          console.log(`live.json updated — ${entries.length} active entries`);
          JSEOF

      - name: Commit and push
        if: steps.validate.outputs.valid == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add leaderboard/live.json
          git diff --cached --quiet || git commit -m "live: update ${{ github.event.issue.user.login }}'s run"
          for i in 1 2 3; do
            git push origin leaderboard && break
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase origin leaderboard
          done

      - name: Delete this and any other open live issues for this user
        if: always()
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Delete rather than close: GitHub emails the author when their issue is
            // closed, even if they unsubscribed, but sends nothing for a deleted one.
            // Deleting needs repo admin, which GITHUB_TOKEN never has; without the
            // LEADERBOARD_ADMIN_TOKEN secret (or if the delete fails) fall back to closing.
            async function removeIssue(issue) {
              const token = process.env.ADMIN_TOKEN;
              if (token) {
                try {
                  const res = await fetch('https://api.github.com/graphql', {
                    method: 'POST',
                    headers: { Authorization: `bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      query: 'mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }',
                      variables: { id: issue.node_id },
                    }),
                  });
                  const json = await res.json().catch(() => ({}));
                  if (res.ok && !json.errors) return;
                  core.warning(`Could not delete issue ${issue.number}: ${JSON.stringify(json.errors ?? res.status)}`);
                } catch (err) {
                  core.warning(`Could not delete issue ${issue.number}: ${err}`);
                }
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
            const author = context.payload.issue.user.login;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: author,
            });
            for (const issue of issues) {
              if (issue.title.startsWith('[Live]')) {
                await removeIssue(issue);
              }
            }

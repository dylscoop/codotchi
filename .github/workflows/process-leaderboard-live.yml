name: Process Live Leaderboard Update

on:
  issues:
    types: [opened]

concurrency:
  group: leaderboard-live
  cancel-in-progress: false

jobs:
  update-live:
    if: startsWith(github.event.issue.title, '[Live]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: leaderboard

      - name: Checkout validator (default branch)
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github/scripts

      # Only signed updates from a Codotchi client pass, and only whitelisted
      # fields are stored (see .github/scripts/leaderboard-validate.mjs).
      - name: Validate update
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          LEADERBOARD_HMAC_KEY: ${{ secrets.LEADERBOARD_HMAC_KEY }}
        run: node tools/.github/scripts/leaderboard-validate.mjs live

      - name: Update live.json
        if: steps.validate.outputs.valid == 'true'
        run: |
          node - <<'JSEOF'
          const fs = require("fs");
          const entry = JSON.parse(fs.readFileSync("/tmp/leaderboard-result.json", "utf8")).entry;
          const path = "leaderboard/live.json";
          let entries = [];
          try { entries = JSON.parse(fs.readFileSync(path, "utf8")); } catch { entries = []; }
          if (!Array.isArray(entries)) { entries = []; }
          const author = entry.username.toLowerCase();
          // Drop unverified entries from older clients, then upsert on (username, petRunId)
          // so one user's pets in different IDEs are tracked independently. Also drop any
          // other entry for this same run (same user + spawnedAt).
          entries = entries.filter(e => e && e.verified === true &&
            !(String(e.username).toLowerCase() === author &&
              (String(e.petRunId) === entry.petRunId || e.spawnedAt === entry.spawnedAt)));
          entries.push(entry);
          fs.writeFileSync(path, JSON.stringify(entries, null, 2) + "\n");
          console.log(`live.json updated — ${entries.length} active entries`);
          JSEOF

      - name: Commit and push
        if: steps.validate.outputs.valid == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add leaderboard/live.json
          git diff --cached --quiet || git commit -m "live: update ${{ github.event.issue.user.login }}'s run"
          for i in 1 2 3; do
            git push origin leaderboard && break
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase origin leaderboard
          done

      - name: Close this and any other open live issues for this user
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: author,
            });
            for (const issue of issues) {
              if (issue.title.startsWith('[Live]')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

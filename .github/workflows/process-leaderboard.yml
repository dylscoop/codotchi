name: Process Leaderboard Submission

on:
  issues:
    types: [opened]

concurrency:
  group: leaderboard-scores
  cancel-in-progress: false

jobs:
  # Always runs so non-matching issues end as a success instead of an all-skipped
  # run, which GitHub reports to the repo owner as "No jobs were run".
  route:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Issue opened; routing by title."

  process:
    name: Validate and record score
    needs: route
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[Leaderboard]')

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: leaderboard
          fetch-depth: 1

      - name: Checkout validator (default branch)
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: .github/scripts

      # HMAC-signed issues from a Codotchi client pass as verified; unsigned ones
      # from pre-2.27.2 clients pass as legacy — see
      # .github/scripts/leaderboard-validate.mjs. Issue text never reaches a shell
      # or a ${{ }} expression; the outcome travels via /tmp/leaderboard-result.json.
      - name: Validate submission
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          LEADERBOARD_HMAC_KEY: ${{ secrets.LEADERBOARD_HMAC_KEY }}
          SCORES_PATH: leaderboard/scores.json
        run: |
          node tools/.github/scripts/leaderboard-validate.mjs score
          node -e "const r=require('/tmp/leaderboard-result.json'); if (r.valid) require('fs').writeFileSync('/tmp/new_entry.json', JSON.stringify(r.entry))"

      - name: Append and commit (on success)
        if: steps.validate.outputs.valid == 'true'
        run: |
          python3 - <<'PYEOF'
          import json

          with open("leaderboard/scores.json") as f:
              data = json.load(f)

          with open("/tmp/new_entry.json") as f:
              entry = json.load(f)

          # Replace an existing entry for the same run (same owner/pet/spawnedAt) instead of
          # appending a duplicate row; append only if this is a genuinely new run.
          for i, s in enumerate(data["scores"]):
              if (s.get("githubUsername") == entry["githubUsername"] and
                      s.get("petName") == entry["petName"] and
                      int(s.get("spawnedAt", 0)) == int(entry["spawnedAt"])):
                  data["scores"][i] = entry
                  break
          else:
              data["scores"].append(entry)

          data["scores"].sort(
              key=lambda s: (s["ageDays"], s["diedAt"] - s["spawnedAt"]),
              reverse=True,
          )

          with open("leaderboard/scores.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          # Remove the user's live entry for this run — pet died, live entry is stale.
          live_path = "leaderboard/live.json"
          try:
              with open(live_path) as f:
                  live = json.load(f)
              if not isinstance(live, list):
                  live = []
          except Exception:
              live = []

          live_user = entry["githubUsername"].lower()
          spawned   = int(entry["spawnedAt"])
          live_pruned = [
              e for e in live
              if not (e.get("username", "").lower() == live_user and
                      int(e.get("spawnedAt", 0)) == spawned)
          ]
          with open(live_path, "w") as f:
              json.dump(live_pruned, f, indent=2)
          PYEOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/scores.json leaderboard/live.json
          ENTRY_DESC=$(python3 -c "import json; e=json.load(open('/tmp/new_entry.json')); print(e['petName'] + ' ' + str(e['ageDays']) + 'd')")
          git commit -m "leaderboard: add ${{ github.event.issue.user.login }} ${ENTRY_DESC}"
          for i in 1 2 3; do
            git push origin leaderboard && break
            echo "Push failed (attempt $i), rebasing..."
            git pull --rebase origin leaderboard
          done

      - name: Log and delete (success)
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
        with:
          script: |
            // Delete rather than close: GitHub emails the author when their issue is
            // closed, even if they unsubscribed, but sends nothing for a deleted one.
            // Deleting needs repo admin, which GITHUB_TOKEN never has; without the
            // LEADERBOARD_ADMIN_TOKEN secret (or if the delete fails) fall back to closing.
            async function removeIssue(issue) {
              const token = process.env.ADMIN_TOKEN;
              if (token) {
                try {
                  const res = await fetch('https://api.github.com/graphql', {
                    method: 'POST',
                    headers: { Authorization: `bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      query: 'mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }',
                      variables: { id: issue.node_id },
                    }),
                  });
                  const json = await res.json().catch(() => ({}));
                  if (res.ok && !json.errors) return;
                  core.warning(`Could not delete issue ${issue.number}: ${JSON.stringify(json.errors ?? res.status)}`);
                } catch (err) {
                  core.warning(`Could not delete issue ${issue.number}: ${err}`);
                }
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
            const entry = JSON.parse(require('fs').readFileSync('/tmp/new_entry.json', 'utf8'));
            core.notice(`Submitted: ${entry.petName} (${entry.petType}) lived ${entry.ageDays} game days.`);
            await removeIssue(context.payload.issue);

      - name: Log and delete (failure)
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
        with:
          script: |
            // Delete rather than close: GitHub emails the author when their issue is
            // closed, even if they unsubscribed, but sends nothing for a deleted one.
            // Deleting needs repo admin, which GITHUB_TOKEN never has; without the
            // LEADERBOARD_ADMIN_TOKEN secret (or if the delete fails) fall back to closing.
            async function removeIssue(issue) {
              const token = process.env.ADMIN_TOKEN;
              if (token) {
                try {
                  const res = await fetch('https://api.github.com/graphql', {
                    method: 'POST',
                    headers: { Authorization: `bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      query: 'mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }',
                      variables: { id: issue.node_id },
                    }),
                  });
                  const json = await res.json().catch(() => ({}));
                  if (res.ok && !json.errors) return;
                  core.warning(`Could not delete issue ${issue.number}: ${JSON.stringify(json.errors ?? res.status)}`);
                } catch (err) {
                  core.warning(`Could not delete issue ${issue.number}: ${err}`);
                }
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
            const reason = JSON.parse(require('fs').readFileSync('/tmp/leaderboard-result.json', 'utf8')).reason;
            core.notice(`Could not process this submission: ${reason}`);
            await removeIssue(context.payload.issue);

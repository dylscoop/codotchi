name: Process Leaderboard Submission

on:
  issues:
    types: [opened]

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  process:
    name: Validate and record score
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[Leaderboard]')

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: leaderboard
          fetch-depth: 1

      - name: Validate and append score
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          LEADERBOARD_HMAC_SECRET: ${{ secrets.LEADERBOARD_HMAC_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, hmac as hmac_lib, hashlib

          VALID_STAGES   = {"egg", "baby", "child", "teen", "adult", "senior"}
          VALID_PET_TYPES = {"codeling", "bytebug", "pixelpup", "shellscript"}
          # Minimum real ms per game day: 80 ticks × 3 s/tick = 240 s = 240 000 ms
          MIN_MS_PER_GAME_DAY = 240_000
          # Stage-age bounds: (min_ageDays, max_ageDays or None)
          # Based on EVOLUTION_DAY_THRESHOLDS from gameEngine.ts + max 9 care-mistake delay days
          STAGE_AGE_BOUNDS = {
              "egg":    (0,   9),
              "baby":   (0,  14),
              "child":  (5,  32),
              "teen":   (23, 104),
              "adult":  (95, 296),
              "senior": (287, None),
          }
          FIVE_MIN_MS = 5 * 60 * 1000
          THREE_YR_MS = 3 * 365 * 24 * 60 * 60 * 1000

          def fail(reason):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"valid=false\n")
                  f.write(f"reason={reason}\n")
              sys.exit(0)

          def succeed(entry):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"valid=true\n")
              # Write sanitised entry to a temp file so the commit step can read it
              with open("/tmp/new_entry.json", "w") as f:
                  json.dump(entry, f)
              sys.exit(0)

          body   = os.environ.get("ISSUE_BODY", "")
          # The issue author is the authoritative GitHub username — always use this
          author = os.environ.get("ISSUE_AUTHOR", "")
          hmac_secret = os.environ.get("LEADERBOARD_HMAC_SECRET", "")

          # Extract the JSON block from the issue body
          match = re.search(r"```json\s*(.*?)\s*```", body, re.DOTALL)
          if not match:
              fail("No JSON code block found in issue body.")

          try:
              data = json.loads(match.group(1))
          except json.JSONDecodeError as e:
              fail(f"Invalid JSON: {e}")

          # Required fields (githubUsername is derived from issue author, not required in body)
          required = ["schemaVersion", "petName", "ageDays", "stage", "petType", "spawnedAt", "diedAt", "hmac"]
          for field in required:
              if field not in data:
                  fail(f"Missing required field: {field}")

          # Schema version
          if data["schemaVersion"] != 1:
              fail(f"Unsupported schemaVersion: {data['schemaVersion']}")

          # ageDays range
          age = int(data["ageDays"])
          if age < 0 or age > 10000:
              fail(f"ageDays out of range: {age}")

          # stage
          stage = str(data["stage"])
          if stage not in VALID_STAGES:
              fail(f"Invalid stage: {stage}")

          # petType
          pet_type = str(data["petType"])
          if pet_type not in VALID_PET_TYPES:
              fail(f"Invalid petType: {pet_type}")

          # timestamps
          spawned_at = int(data["spawnedAt"])
          died_at    = int(data["diedAt"])
          if died_at <= spawned_at:
              fail("diedAt must be after spawnedAt.")

          # Timestamp sanity
          now_ms = int(time.time() * 1000)
          if spawned_at > now_ms + FIVE_MIN_MS:
              fail("spawnedAt is in the future.")
          if spawned_at < now_ms - THREE_YR_MS:
              fail("spawnedAt is implausibly old.")
          if died_at > now_ms + FIVE_MIN_MS:
              fail("diedAt is in the future.")

          # Physics floor anti-cheat
          elapsed_ms = died_at - spawned_at
          if elapsed_ms < age * MIN_MS_PER_GAME_DAY:
              fail(f"Real elapsed time ({elapsed_ms} ms) is less than the minimum for {age} game days ({age * MIN_MS_PER_GAME_DAY} ms). Submission rejected.")

          # Stage-age consistency check
          min_age, max_age = STAGE_AGE_BOUNDS[stage]
          if age < min_age or (max_age is not None and age > max_age):
              fail(f"ageDays {age} is inconsistent with stage '{stage}' (expected {min_age}–{max_age if max_age else '∞'}).")

          # HMAC signature verification
          if hmac_secret:
              canonical = f"{age}:{pet_type}:{stage}:{spawned_at}:{died_at}"
              expected = hmac_lib.new(hmac_secret.encode(), canonical.encode(), hashlib.sha256).hexdigest()
              if not hmac_lib.compare_digest(str(data.get("hmac", "")), expected):
                  fail("HMAC signature invalid. Submission rejected.")

          # Duplicate check
          with open("leaderboard/scores.json") as f:
              existing = json.load(f)
          for s in existing.get("scores", []):
              if int(s.get("spawnedAt", 0)) == spawned_at and int(s.get("diedAt", 0)) == died_at:
                  fail("This run has already been submitted.")

          entry = {
              "schemaVersion":  1,
              "githubUsername": author,  # always use the authenticated issue author
              "petName":        str(data["petName"])[:64],
              "ageDays":        age,
              "stage":          str(data["stage"]),
              "petType":        str(data["petType"]),
              "spawnedAt":      spawned_at,
              "diedAt":         died_at,
              "submittedAt":    int(time.time() * 1000),
          }
          succeed(entry)
          PYEOF

      - name: Append and commit (on success)
        if: steps.validate.outputs.valid == 'true'
        run: |
          python3 - <<'PYEOF'
          import json

          with open("leaderboard/scores.json") as f:
              data = json.load(f)

          with open("/tmp/new_entry.json") as f:
              entry = json.load(f)

          data["scores"].append(entry)
          data["scores"].sort(
              key=lambda s: (s["ageDays"], s["diedAt"] - s["spawnedAt"]),
              reverse=True,
          )

          with open("leaderboard/scores.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          # Remove the user's live entry for this run — pet died, live entry is stale.
          live_path = "leaderboard/live.json"
          try:
              with open(live_path) as f:
                  live = json.load(f)
              if not isinstance(live, list):
                  live = []
          except Exception:
              live = []

          live_user = entry["githubUsername"].lower()
          spawned   = int(entry["spawnedAt"])
          live_pruned = [
              e for e in live
              if not (e.get("username", "").lower() == live_user and
                      int(e.get("spawnedAt", 0)) == spawned)
          ]
          with open(live_path, "w") as f:
              json.dump(live_pruned, f, indent=2)
          PYEOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/scores.json leaderboard/live.json
          ENTRY_DESC=$(python3 -c "import json; e=json.load(open('/tmp/new_entry.json')); print(e['petName'] + ' ' + str(e['ageDays']) + 'd')")
          git commit -m "leaderboard: add ${{ github.event.issue.user.login }} ${ENTRY_DESC}"
          git push origin leaderboard

      - name: Comment and close (success)
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const entry = JSON.parse(fs.readFileSync('/tmp/new_entry.json', 'utf8'));
            const age = entry.ageDays;
            const ageStr = age >= 365
              ? `${Math.floor(age/365)}y ${age%365}d`
              : `${age}d`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Submitted!** ${entry.petName} (${entry.petType}) lived **${ageStr}** game days.\n\n[View the leaderboard](https://dylscoop.github.io/codotchi/leaderboard/)`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Comment and close (failure)
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = `${{ steps.validate.outputs.reason }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Could not process this submission: **${reason}**\n\nIf this looks like a bug, please open a separate issue.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
